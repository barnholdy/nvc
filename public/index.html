  <link href="https://fonts.googleapis.com/css?family=Roboto:100:300,400,500,700,900|Material+Icons" rel="stylesheet">
  <script>
    // A page kept in the browser cache points at script files that the next
    // deploy replaced. Loading it then fails silently and leaves a black screen,
    // so ask the server for a fresh copy once instead of sitting there.
    (function () {
      var FLAG = 'nvc.assetReload';
      window.addEventListener('error', function (e) {
        var el = e && e.target;
        if (!el) return;
        // Only our own build output. A blocked web font or a missing icon is
        // not worth a reload — and would fire on every visit while offline.
        var url = el.tagName === 'SCRIPT' ? el.src
          : (el.tagName === 'LINK' && el.rel === 'stylesheet' ? el.href : '');
        if (!url || url.lastIndexOf(location.origin, 0) !== 0) return;
        try {
          if (sessionStorage.getItem(FLAG)) return;
          sessionStorage.setItem(FLAG, '1');
        } catch (err) { return; }
        location.replace(location.pathname + '?v=' + Date.now() + location.hash);
      }, true);
      window.addEventListener('load', function () {
        // Booted fine, so a later failure may try again.
        try { sessionStorage.removeItem(FLAG); } catch (err) { /* private mode */ }
      });
    }());
  </script>
</head>

<body>
  <noscript>

    </noscript>

  <!-- built files will be auto injected -->
</body>
